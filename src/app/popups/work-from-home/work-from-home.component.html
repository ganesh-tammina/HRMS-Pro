<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Work From Home Request</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="submitRequest()">
    <ion-list>
      <ion-item>
        <ion-label position="floating">Start Date</ion-label>
        <ion-datetime-button datetime="startDate"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="startDate"></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <ion-item>
        <ion-select label="Request Type" placeholder="Select One">
          <ion-select-option value="full">Full Day</ion-select-option>
          <ion-select-option value="partial">Partial Day</ion-select-option>
          <ion-select-option value="extended">Extended Period</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-textarea label="Reason/Plan" placeholder="Enter reason and daily plan..."></ion-textarea>
      </ion-item>

      <ion-item lines="none">
        <ion-toggle justify="space-between">I have secure VPN access</ion-toggle>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="ion-margin-top">
      Submit Request
    </ion-button>
  </form>
</ion-content>
